name: Fetch Trustpilot Reviews

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:          # también ejecutable manualmente desde GitHub

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and parse Trustpilot reviews
        env:
          TRUSTPILOT_URL: ${{ secrets.TRUSTPILOT_URL }}
        run: python .github/workflows/fetch_reviews.py

      - name: Commit reviews.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          git diff --cached --quiet || git commit -m "chore: update reviews.json [skip ci]"
          git push
